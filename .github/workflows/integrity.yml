name: integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wordlists are correct
        run: python3 scripts/verify.py

      - name: Files and links agree
        run: ./scripts/check.sh
